[project]
name = "arithmp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Mikaël Capelle", email = "capelle.mikael@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["click>=8.5.0", "lark>=1.3.1"]

[project.scripts]
arithmp = "arithmp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["poethepoet>=0.48.0", "ruff>=0.17.0", "ty>=0.0.86"]

[tool.poe.tasks]
format-imports = "ruff check --select I --fix"
format-ruff = "ruff format"
format.sequence = ["format-imports", "format-ruff"]
lint-ruff = "ruff check"
lint-ruff-format = "ruff format --check"
lint-ty = "ty check"
lint.sequence = ["lint-ruff", "lint-ruff-format", "lint-ty"]
lint.ignore_fail = "return_non_zero"

[tool.ruff.lint]
extend-select = ["I"]
